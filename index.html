<!DOCTYPE html>
<html>
<head>
  <title>PhonePilot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      font-family:Arial,sans-serif;
      padding:20px;
      background:#f5f5f5;
    }

    h1{
      text-align:center;
    }

    input{
      padding:10px;
      width:200px;
    }

    button{
      padding:10px 20px;
      cursor:pointer;
    }

    .card{
      background:white;
      padding:15px;
      margin-top:10px;
      border-radius:10px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<h1>📱 PhonePilot</h1>

<p>Find the best smartphone for your budget.</p>

  <input id="phoneSearch" 
       type="text"
       placeholder="Search Phone Model">

  <button onclick="searchPhone()">
  Search Phone
  </button>
  
<input id="budget" type="number" placeholder="Enter Budget">

<button onclick="findPhones()">
  Find Phones
</button>

<div id="results"></div>

<script src="smartphoneData.js"></script>

<script>

function findPhones() {

  const budget = Number(
    document.getElementById("budget").value
  );

  const phones = smartphoneData["Combined Data"];

  const results = phones.filter(phone => {

    const price = parseInt(
      String(phone["Price (₹)"])
        .replace(/[^0-9]/g, "")
    );

    return price <= budget;

  });

  if(results.length === 0){
    document.getElementById("results").innerHTML =
      "<h3>No phones found.</h3>";
    return;
  }

  results.forEach(phone => {

    const gaming =
      Number(phone["Gaming Score"] || 0);

    const camera =
      Number(phone["Camera Score"] || 0);

    const battery =
      Number(phone["Battery Score"] || 0);

    phone.overall =
      (gaming + camera + battery) / 3;

  });

  results.sort((a,b) =>
    b.overall - a.overall
  );

  const top10 = results.slice(0,10);

  let html = `
    <h2>🏆 Top Phones Under ₹${budget}</h2>
  `;

  top10.forEach((phone,index) => {

    html += `
      <div class="card">

        <h3>
          #${index + 1}
          ${phone.Brand}
          ${phone.Model}
        </h3>

        <p><b>Price:</b> ₹${phone["Price (₹)"]}</p>

        <p><b>Overall Score:</b>
        ${phone.overall.toFixed(1)}</p>

        <p><b>Gaming:</b>
        ${phone["Gaming Score"]}</p>

        <p><b>Camera:</b>
        ${phone["Camera Score"]}</p>

        <p><b>Battery:</b>
        ${phone["Battery Score"]}</p>

      </div>
    `;

  });

  document.getElementById("results").innerHTML =
    html;

}

  function searchPhone() {

  const query =
    document.getElementById("phoneSearch")
      .value
      .toLowerCase();

  const phones =
    smartphoneData["Combined Data"];

  const results = phones.filter(phone =>
    `${phone.Brand} ${phone.Model}`
      .toLowerCase()
      .includes(query)
  );

  let html = "";

  if(results.length === 0) {

    html = "<h3>No matching phone found.</h3>";

  } else {

    results.forEach(phone => {

      html += `
      <div class="card">

        <h3>${phone.Brand} ${phone.Model}</h3>

        <p>Price: ₹${phone["Price (₹)"]}</p>

        <p>Processor: ${phone.Processor}</p>

        <p>RAM: ${phone.RAM}</p>

        <p>Storage: ${phone.Storage}</p>

      </div>
      `;

    });

  }

  document.getElementById("results").innerHTML =
    html;
  }
  


</script>

</body>
</html>
