<!DOCTYPE html>
<html>
<head>
  <title>PhonePilot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family: Arial; padding: 20px;">

<h1>📱 PhonePilot</h1>
<p>Find the best smartphone for your budget.</p>

<input id="budget" type="number" placeholder="Enter budget">
<button onclick="findPhones()">Find Phones</button>

<div id="results"></div>

<script>
function findPhones() {
  const budget = Number(document.getElementById("budget").value);

  const results = phones.filter(
    phone => phone.price <= budget
  );

  let html = "<h3>Results</h3>";

  results.forEach(phone => {
    html += `
      <div>
        <b>${phone.brand} ${phone.model}</b><br>
        ₹${phone.price}
      </div>
      <hr>
    `;
  };

  document.getElementById("results").innerHTML = html;
}
</script>
<script src="phones.js"></script>
</body>
</html>
