<!DOCTYPE html>
<html>
<head>
  <title>PhonePilot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    input {
      padding: 10px;
      width: 200px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
    }

    .card {
      background: white;
      padding: 15px;
      margin-top: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<h1>📱 PhonePilot</h1>

<p>Find the best smartphone for your budget.</p>

<input id="budget" type="number" placeholder="Enter Budget">

<button onclick="findPhones()">
  Find Phones
</button>

<div id="results"></div>
<script src="smartphoneData.js"></script>
  
<script>


function findPhones() {

  const budget = Number(
    document.getElementById("budget").value
  );

  const phones = smartphoneData["Combined Data"];

  const results = phones.filter(phone => {

    const price = Number(
      String(phone["Price (₹)"])
        .replace(/,/g, "")
        .replace("*", "")
    );

    return price <= budget;

  });

  let html = "";

  if (results.length === 0) {

    html =
      "<h3>No phones found under this budget.</h3>";

  } else {

    results.forEach(phone => {

      html += `
      <div class="card">

        <h3>
          ${phone.Brand} ${phone.Model}
        </h3>

        <p>
          Price: ₹${phone["Price (₹)"]}
        </p>

        <p>
          Processor: ${phone.Processor}
        </p>

        <p>
          RAM: ${phone.RAM}
        </p>

        <p>
          Storage: ${phone.Storage}
        </p>

        <p>
          Gaming Score: ${phone["Gaming Score"]}
        </p>

        <p>
          Camera Score: ${phone["Camera Score"]}
        </p>

        <p>
          Battery Score: ${phone["Battery Score"]}
        </p>

      </div>
      `;

    });

  }

  document.getElementById("results").innerHTML =
    html;

}


</script>

</body>
</html>
