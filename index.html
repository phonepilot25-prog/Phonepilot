<!DOCTYPE html>
<html>
<head>
  <title>PhonePilot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      font-family:Arial,sans-serif;
      padding:20px;
      background:#f5f5f5;
    }

    h1{
      text-align:center;
    }

    input{
      padding:10px;
      width:200px;
    }

    button{
      padding:10px 20px;
      cursor:pointer;
    }

    .card{
      background:white;
      padding:15px;
      margin-top:10px;
      border-radius:10px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<h1>📱 PhonePilot</h1>

<p>Find the best smartphone for your budget.</p> 

  <input id="compare1" type="text" placeholder="First Phone">

<input id="compare2" type="text" placeholder="Second Phone">

<button onclick="comparePhones()">
Compare Phones
</button>

  <input id="phoneSearch" 
       type="text"
       placeholder="Search Phone Model">

  <button onclick="searchPhone()">
  Search Phone
  </button>
  
<input id="budget" type="number" placeholder="Enter Budget">

<button onclick="findPhones()">
  Find Phones
</button>

<div id="results"></div>

<script src="smartphoneData.js"></script>

<script>

function findPhones() {

  const budget = Number(
    document.getElementById("budget").value
  );

  const phones = smartphoneData["Combined Data"];

  const results = phones.filter(phone => {

    const price = parseInt(
      String(phone["Price (₹)"])
        .replace(/[^0-9]/g, "")
    );

    return price <= budget;

  });

  if(results.length === 0){
    document.getElementById("results").innerHTML =
      "<h3>No phones found.</h3>";
    return;
  }

  results.forEach(phone => {

    const gaming =
      Number(phone["Gaming Score"] || 0);

    const camera =
      Number(phone["Camera Score"] || 0);

    const battery =
      Number(phone["Battery Score"] || 0);

    phone.overall =
      (gaming + camera + battery) / 3;

  });

  results.sort((a,b) =>
    b.overall - a.overall
  );

  const top10 = results.slice(0,10);

  let html = `
    <h2>🏆 Top Phones Under ₹${budget}</h2>
  `;

  top10.forEach((phone,index) => {

    html += `
      <div class="card">

        <h3>
<a href="phone.html?id=${encodeURIComponent(phone.Brand + ' ' + phone.Model)}">
${phone.Brand} ${phone.Model}
</a>
</h3>

        <p><b>Price:</b> ₹${phone["Price (₹)"]}</p>

        <p><b>Overall Score:</b>
        ${phone.overall.toFixed(1)}</p>

        <p><b>Gaming:</b>
        ${phone["Gaming Score"]}</p>

        <p><b>Camera:</b>
        ${phone["Camera Score"]}</p>

        <p><b>Battery:</b>
        ${phone["Battery Score"]}</p>

      </div>
    `;

  });

  document.getElementById("results").innerHTML =
    html;

}

  function searchPhone() {

  const query =
    document.getElementById("phoneSearch")
      .value
      .toLowerCase();

  const phones =
    smartphoneData["Combined Data"];

  const results = phones.filter(phone =>
    `${phone.Brand} ${phone.Model}`
      .toLowerCase()
      .includes(query)
  );

  let html = "";

  if(results.length === 0) {

    html = "<h3>No matching phone found.</h3>";

  } else {

    results.forEach(phone => {

      html += `
      <div class="card">

        <h3>${phone.Brand} ${phone.Model}</h3>

        <p>Price: ₹${phone["Price (₹)"]}</p>

        <p>Processor: ${phone.Processor}</p>

        <p>RAM: ${phone.RAM}</p>

        <p>Storage: ${phone.Storage}</p>

      </div>
      `;

    });

  }

  document.getElementById("results").innerHTML =
    html;
  }

  function comparePhones() {

  const phone1Name =
    document.getElementById("compare1")
      .value
      .toLowerCase();

  const phone2Name =
    document.getElementById("compare2")
      .value
      .toLowerCase();

  const phones =
    smartphoneData["Combined Data"];

  const phone1 = phones.find(phone =>
    `${phone.Brand} ${phone.Model}`
      .toLowerCase()
      .includes(phone1Name)
  );

  const phone2 = phones.find(phone =>
    `${phone.Brand} ${phone.Model}`
      .toLowerCase()
      .includes(phone2Name)
  );

  if(!phone1 || !phone2) {

    document.getElementById("results").innerHTML =
      "<h3>One or both phones not found.</h3>";

    return;
  }

  document.getElementById("results").innerHTML = `
    <div class="card">

      <h2>
        ${phone1.Brand} ${phone1.Model}
        VS
        ${phone2.Brand} ${phone2.Model}
      </h2>

      <table border="1" cellpadding="8" style="width:100%; border-collapse:collapse;">

        <tr>
          <th>Feature</th>
          <th>${phone1.Model}</th>
          <th>${phone2.Model}</th>
        </tr>

        <tr>
          <td>Price</td>
          <td>₹${phone1["Price (₹)"]}</td>
          <td>₹${phone2["Price (₹)"]}</td>
        </tr>

        <tr>
          <td>Processor</td>
          <td>${phone1.Processor}</td>
          <td>${phone2.Processor}</td>
        </tr>

        <tr>
          <td>RAM</td>
          <td>${phone1.RAM}</td>
          <td>${phone2.RAM}</td>
        </tr>

        <tr>
          <td>Storage</td>
          <td>${phone1.Storage}</td>
          <td>${phone2.Storage}</td>
        </tr>

        <tr>
          <td>Gaming Score</td>
          <td>${phone1["Gaming Score"]}</td>
          <td>${phone2["Gaming Score"]}</td>
        </tr>

        <tr>
          <td>Camera Score</td>
          <td>${phone1["Camera Score"]}</td>
          <td>${phone2["Camera Score"]}</td>
        </tr>

        <tr>
          <td>Battery Score</td>
          <td>${phone1["Battery Score"]}</td>
          <td>${phone2["Battery Score"]}</td>
        </tr>

      </table>

    </div>
  `;
  }


</script>

</body>
</html>
